<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Coffee House</title>
		<link rel="shortcut icon" type="image/svg" href="../assets/img/favicon.svg">
		<link rel="stylesheet" href="../assets/css/normalize.css">
		<link rel="stylesheet" href="../assets/css/style.css">
	</head>
	<body>
		<header class="header">
			<div class="wrapper">
				<div class="logo">
					<a href="../" class="logo__link">
						<svg class="logo__img logo__img_light" width="100" height="60">
							<use xlink:href="../assets/img/logo.svg#logo"></use>
						</svg>
						<svg class="logo__img logo__img_dark" width="100" height="60">
							<use xlink:href="../assets/img/logo-dark.svg#logo"></use>
						</svg>
					</a>
				</div>
				<nav class="nav">
					<ul class="nav__list list-reset">
						<li class="nav__item"><a href="../#favorite" class="nav__link">Favorite coffee</a></li>
						<li class="nav__item"><a href="../#about" class="nav__link">About</a></li>
						<li class="nav__item"><a href="../#app" class="nav__link">Mobile app</a></li>
						<li class="nav__item"><a href="#footer" class="nav__link">Contact us</a></li>
					</ul>
				</nav>
				<div class="actions">
					<button class="theme-btn btn-reset" aria-label="Toggle theme">
						<svg class="theme-btn__icon theme-btn__icon_light active" aria-hidden="true">
							<use xlink:href="/assets/img/svg/sun.svg#sun"></use>
						</svg>
						<svg class="theme-btn__icon theme-btn__icon_dark" aria-hidden="true">
							<use xlink:href="/assets/img/svg/moon.svg#moon"></use>
						</svg>
					</button>
					<a href="./" class="menu-btn btn-reset"><span class="menu-btn__text">Menu</span>
						<svg class="menu-btn__icon" aria-hidden="true">
							<use xlink:href="/assets/img/svg/cup.svg#cup"></use>
						</svg>
					</a>
					<button class="burger btn-reset" aria-label="open burger">
            <span class="burger__line" aria-hidden="true"></span>
            <span class="burger__line" aria-hidden="true"></span>
          </button>
					<span class="overlay" aria-hidden="true"></span>
				</div>
			</div>
		</header>

		<main>
			<section class="menu">
				<div class="wrapper">
					<h1 class="title">Behind each of our cups hides an <em class="text-accent">amazing surprise</em></h1>
				</div>
			</section>
		</main>
	
		<footer class="footer" id="footer">
			<div class="wrapper">
				<div class="promo">
					<h2 class="title">Sip, Savor, Smile. 
						<em class="text-accent">It’s coffee time!</em>
					</h2>
					<ul class="social__list list-reset">
						<li class="social__item">
							<a href="" class="social__link" aria-label="Twitter" target="_blank" rel="noopener noreferrer">
								<svg class="icon" aria-hidden="true">
									<use xlink:href="../assets/img/svg/social/twitter.svg#link"></use>
								</svg>
							</a>
						</li>
						<li class="social__item">
							<a href="" class="social__link" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
								<svg class="icon" aria-hidden="true">
									<use xlink:href="../assets/img/svg/social/instagram.svg#link"></use>
								</svg>
							</a>
						</li>
						<li class="social__item">
							<a href="" class="social__link" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
								<svg class="icon" aria-hidden="true">
									<use xlink:href="../assets/img/svg/social/facebook.svg#link"></use>
								</svg>
							</a>
						</li>
					</ul>
				</div>
				<div class="contacts">
					<p class="contacts__title">Contact us</p>
					<ul class="contacts__list list-reset">
						<li class="contacts__item">
							<a href="https://maps.app.goo.gl/okd1rXwTDixUdJB59" class="contacts__link" target="_blank" rel="noopener noreferrer">
								<svg class="contacts__icon" aria-hidden="true">
									<use xlink:href="../assets/img/svg/contact/map.svg#link"></use>
								</svg>
								<span class="contacts__text">8558 Green Rd., LA</span>
							</a>
						</li>
						<li class="contacts__item">
							<a href="tel:+16035550123" class="contacts__link" target="_blank" rel="noopener noreferrer">
								<svg class="contacts__icon" aria-hidden="true">
									<use xlink:href="../assets/img/svg/contact/phone.svg#link"></use>
								</svg>
								<span class="contacts__text">+1 (603) 555-0123</span>
							</a>
						</li>
						<li class="contacts__item">
							<a href="" class="contacts__link">
								<svg class="contacts__icon" aria-hidden="true">
									<use xlink:href="../assets/img/svg/contact/clock.svg#link"></use>
								</svg>
								<span class="contacts__text">Mon–Sat: 9:00–23:00</span>
							</a>
						</li>
					</ul>
				</div>
			</div>
		</footer>

		<script src="../assets/js/burger.js"></script>
		<script src="../assets/js/theme.js"></script>
	</body>
</html>
